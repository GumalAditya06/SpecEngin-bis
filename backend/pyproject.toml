[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specengine-bis"
version = "0.1.0"
description = "Specengine-BIS — BIS intelligence platform backend (ingestion + API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.3.10",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tqdm>=4.66.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
