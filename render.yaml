# Render Blueprint for the two Python services. The Next.js frontend stays on Vercel.
# Render prompts for BIS_LLM_API_KEY during Blueprint creation; it is never in Git.
services:
  - type: web
    name: specengin-catalogue
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    initialDeployHook: python -m app.seed
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BIS_DATABASE_URL
        fromDatabase:
          name: specengin-db
          property: connectionString
      - key: BIS_SECRET_KEY
        generateValue: true

databases:
  - name: specengin-db
    plan: free
    region: singapore
    databaseName: specengin
    user: specengin
