[project]
name = "specengine-bis-corpus"
version = "0.1.0"
description = "Targeted, provenance-preserving collector for the Specengine BIS corpus"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pymupdf>=1.24", "pytesseract>=0.3.10", "Pillow>=10", "pydantic>=2.10,<3"]

[project.optional-dependencies]
# Stage 3.1 embedding inference. Kept optional so collection-only installs
# (Stages 1-2) stay small; CPU torch is enough for this corpus size.
embeddings = ["sentence-transformers>=3.0", "torch>=2.2", "numpy>=1.26"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
bis-corpus = "scraper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: downloads or loads a real sentence-transformers model"]
